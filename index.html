
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101814">
<title>Fishin Friendzy</title>
<style>
:root{color-scheme:dark;--bg:#101814;--panel:#1b2720;--green:#9bd36b;--red:#ff7777;--muted:#a7b5aa;--line:#354439}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f2f6ef;font:16px Arial,sans-serif}
header{padding:20px 15px;background:#17231b;border-bottom:1px solid var(--line)}
h1{margin:0;color:var(--green);font-size:27px}
header p{margin:7px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;gap:7px;padding:12px;overflow-x:auto;background:#141e17}
button{background:#2a3b2e;color:white;border:1px solid #49604c;border-radius:9px;padding:11px 13px;font-weight:bold;cursor:pointer}
button.active,button.primary{background:var(--green);color:#142015;border-color:var(--green)}
main{padding:14px;max-width:900px;margin:auto}
h2{font-size:21px;margin:10px 0 14px}
h3{font-size:17px}
.panel,.fixture{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted,small{color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:10px 7px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--green)}
th:nth-child(2),td:nth-child(2){text-align:left}
input,select{width:100%;padding:12px;background:#101814;color:white;border:1px solid #526454;border-radius:8px;margin:6px 0 12px;font-size:16px}
label{display:block;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{width:100%}
.fixture-top{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center;font-weight:bold}
.team-name{overflow-wrap:anywhere}
.score{font-size:24px;color:var(--green);white-space:nowrap}
.outcome-win{color:var(--green);font-size:19px;font-weight:bold}
.outcome-loss{color:var(--red);font-size:19px;font-weight:bold}
.outcome-draw{color:#f0d67a;font-size:19px;font-weight:bold}
.status{font-size:12px;color:var(--green)}
.empty{text-align:center;padding:24px;color:var(--muted)}
.danger{background:#472624;border-color:#7d403a}
.archive-item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.notice{border-left:3px solid var(--green);padding:10px 12px;background:#202d23;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
<h1>🎣 Fishin Friendzy</h1>
<p>Your fishing league. Your fixtures. Your bragging rights.</p>
</header>
<nav id="nav">
<button data-page="league" class="active">🏆 League</button>
<button data-page="fixtures">📅 Fixtures</button>
<button data-page="add">➕ Add Fixture</button>
<button data-page="teams">🐟 Teams</button>
<button data-page="history">📚 History</button>
</nav>
<main id="app"></main>
<script>
const KEY='fishin-friendzy-data-v1';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function currentMonth(){
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthName(key){
 if(!key||!/^\d{4}-\d{2}$/.test(key))return 'Unknown month';
 const [y,m]=key.split('-').map(Number);
 return (MONTHS[m-1]||'Unknown')+' '+y;
}
function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function readData(){
 try{
  const d=JSON.parse(localStorage.getItem(KEY));
  if(d&&Array.isArray(d.fixtures)){
   if(!d.archives||typeof d.archives!=='object')d.archives={};
   d.fixtures.forEach(f=>{
    if(!f.monthKey){
     f.monthKey=(f.date&&/^\d{4}-\d{2}/.test(f.date))
      ?f.date.slice(0,7):currentMonth();
    }
   });
   return d;
  }
 }catch(e){}
 return {fixtures:[],archives:{}};
}
let data=readData();
let page='league';
let historyMonth='';
let selectedHistoryMonth='';

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(data));
 }catch(e){
  alert('Your browser could not save the data. Please check available storage and make a backup.');
 }
}
function fixturesFor(month){
 return data.fixtures.filter(f=>f.monthKey===month);
}
function teamsFor(month){
 return [...new Set(fixturesFor(month).flatMap(f=>[f.home,f.away]).filter(Boolean))]
 .sort((a,b)=>a.localeCompare(b));
}
function statsFor(month){
 const out={};
 teamsFor(month).forEach(t=>out[t]={
  team:t,p:0,w:0,d:0,l:0,for:0,against:0,played:0
 });
 fixturesFor(month).filter(f=>f.played).forEach(f=>{
  if(!out[f.home]||!out[f.away])return;
  const h=out[f.home],a=out[f.away];
  const hs=Number(f.hs),as=Number(f.as);
  h.played++;a.played++;
  h.for+=hs;h.against+=as;
  a.for+=as;a.against+=hs;
  if(hs>as){h.w++;h.p+=3;a.l++}
  else if(hs<as){a.w++;a.p+=3;h.l++}
  else{h.d++;a.d++;h.p++;a.p++}
 });
 return Object.values(out).map(t=>({...t,gd:t.for-t.against}))
 .sort((a,b)=>b.p-a.p||b.gd-a.gd||b.for-a.for||a.team.localeCompare(b.team));
}
function snapshot(month){
 const fs=fixturesFor(month).map(f=>({...f}));
 const table=statsFor(month);
 const completed=fs.some(f=>f.played);
 return {
  month,
  fixtures:fs,
  table,
  winner:completed&&table.length?table[0].team:'',
  completed:fs.filter(f=>f.played).length,
  createdAt:new Date().toISOString()
 };
}
function archivePastMonths(){
 const now=currentMonth();
 const months=[...new Set(data.fixtures.map(f=>f.monthKey).filter(Boolean))];
 months.filter(m=>m<now).forEach(m=>{
  // Rebuild the archive from saved fixtures so the final table is accurate.
  data.archives[m]=snapshot(m);
 });
 save();
}
function outcome(f,team){
 if(!f.played)return '';
 const hs=Number(f.hs),as=Number(f.as);
 if(hs===as)return '<span class="outcome-draw" title="Draw">＝</span>';
 const won=(team===f.home&&hs>as)||(team===f.away&&as>hs);
 return won
  ?'<span class="outcome-win" title="Winner">✓</span>'
  :'<span class="outcome-loss" title="Loser">✗</span>';
}
function fixtureCard(f,readOnly=false){
 const home=esc(f.home),away=esc(f.away);
 const score=f.played?esc(f.hs)+' - '+esc(f.as):'v';
 const index=data.fixtures.indexOf(f);
 return `<div class="fixture">
 <div class="fixture-top"><span>${esc(f.date||'Date not set')}</span>
 <span class="status">${f.played?'✓ RESULT':'UPCOMING'}</span></div>
 <div class="teams">
 <span class="team-name">${outcome(f,f.home)} ${home}</span>
 <span class="score">${score}</span>
 <span class="team-name">${away} ${outcome(f,f.away)}</span>
 </div>
 ${f.notes?`<p class="muted">${esc(f.notes)}</p>`:''}
 ${readOnly?'':`<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
 <button class="primary" onclick="editResult(${index})">${f.played?'Edit score':'Enter result'}</button>
 <button class="danger" onclick="deleteFixture(${index})">Delete</button>
 </div>`}
 </div>`;
}
function tableHTML(table){
 const rows=table.map((t,i)=>`<tr>
 <td>${i+1}</td><td><b>${esc(t.team)}</b></td>
 <td>${t.played}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
 <td>${t.for}</td><td>${t.against}</td>
 <td>${t.gd>0?'+':''}${t.gd}</td><td><b>${t.p}</b></td>
 </tr>`).join('');
 return `<div class="table-wrap"><table>
 <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Fish+</th><th>Fish−</th><th>FD</th><th>Pts</th></tr></thead>
 <tbody>${rows||'<tr><td colspan="10">No teams yet this month</td></tr>'}</tbody>
 </table></div>`;
}
function showLeague(){
 const month=currentMonth(),table=statsFor(month);
 return `<h2>🏆 ${esc(monthName(month))} League</h2>
 <div class="panel">${tableHTML(table)}
 <p class="muted">Win = 3 points · Draw = 1 point each · Loss = 0 points. FD = fish difference.</p>
 <p class="notice">Monthly standings use results from this month. Previous months are kept in History.</p></div>
 <h2>Latest Results</h2>
 ${fixturesFor(month).some(f=>f.played)
  ?fixturesFor(month).filter(f=>f.played).slice().reverse().map(f=>fixtureCard(f)).join('')
  :'<div class="panel empty">No results recorded this month yet.</div>'}`;
}
function showFixtures(){
 const fs=fixturesFor(currentMonth()).slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
 return `<h2>📅 ${esc(monthName(currentMonth()))} Fixtures</h2>
 ${fs.length?fs.map(f=>fixtureCard(f)).join(''):'<div class="panel empty">No fixtures this month. Add one to get started.</div>'}
 <p class="muted">Green ✓ = winner · Red ✗ = loser · Yellow ＝ = draw.</p>`;
}
function showAdd(){
 const ts=teamsFor(currentMonth());
 return `<h2>➕ Add Fixture</h2><div class="panel"><form id="fixtureForm">
 <label>Home team</label><input name="home" required maxlength="50" placeholder="e.g. The Carp Kings" list="teamList">
 <label>Away team</label><input name="away" required maxlength="50" placeholder="e.g. Bait Bandits" list="teamList">
 <datalist id="teamList">${ts.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
 <div class="grid"><div><label>Fixture date</label><input type="date" name="date" value="${currentMonth()}-01"></div>
 <div><label>Venue (optional)</label><input name="notes" maxlength="100" placeholder="Lake / venue"></div></div>
 <button class="primary full" type="submit">Save Fixture</button></form></div>
 <p class="muted">Fixtures are grouped by their date's month. Teams are created automatically.</p>`;
}
function showTeams(){
 const ts=teamsFor(currentMonth());
 return `<h2>🐟 ${esc(monthName(currentMonth()))} Teams</h2><div class="panel">
 ${ts.length?ts.map(t=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)">${esc(t)}</div>`).join(''):'<p class="muted">No teams yet this month. Add a fixture to create your teams.</p>'}
 </div>`;
}
function showHistory(){
 const months=[...new Set([
  ...Object.keys(data.archives),
  ...data.fixtures.map(f=>f.monthKey)
 ])].filter(m=>m&&m<currentMonth()).sort().reverse();
 if(!months.length)return `<h2>📚 League History</h2><div class="panel empty">No previous months archived yet. Your current month will be archived when a new month begins.</div>`;
 if(selectedHistoryMonth&&months.includes(selectedHistoryMonth)){
  const a=data.archives[selectedHistoryMonth]||snapshot(selectedHistoryMonth);
  const table=a.table||statsFor(selectedHistoryMonth);
  const winner=a.winner||'No winner recorded';
  return `<h2>📚 ${esc(monthName(selectedHistoryMonth))}</h2>
  <div class="panel"><h3>🏆 Monthly Winner: ${esc(winner)}</h3>
  <p class="muted">${a.completed||0} completed fixtures</p>${tableHTML(table)}
  <p><button onclick="selectedHistoryMonth='';render()">← Back to History</button></p></div>
  <h3>Fixtures & Results</h3>
  ${(a.fixtures||fixturesFor(selectedHistoryMonth)).length
   ?(a.fixtures||fixturesFor(selectedHistoryMonth)).map(f=>fixtureCard(f,true)).join('')
   :'<div class="panel empty">No fixtures saved.</div>'}`;
 }
 return `<h2>📚 League History</h2>
 <p class="muted">Archived monthly tables, results and winners.</p>
 ${months.map(m=>{
  const a=data.archives[m]||snapshot(m);
  return `<div class="panel archive-item"><div><b>${esc(monthName(m))}</b><p class="muted">${a.completed||0} completed fixtures · Winner: ${esc(a.winner||'Not decided')}</p></div>
  <button class="primary" onclick="selectedHistoryMonth='${m}';render()">View month</button></div>`;
 }).join('')}`;
}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const app=document.getElementById('app');
 if(page==='league')app.innerHTML=showLeague();
 else if(page==='fixtures')app.innerHTML=showFixtures();
 else if(page==='add')app.innerHTML=showAdd();
 else if(page==='teams')app.innerHTML=showTeams();
 else if(page==='history')app.innerHTML=showHistory();
 const form=document.getElementById('fixtureForm');
 if(form)form.addEventListener('submit',e=>{
  e.preventDefault();
  const fd=new FormData(form);
  const home=String(fd.get('home')||'').trim();
  const away=String(fd.get('away')||'').trim();
  const date=String(fd.get('date')||'');
  if(!home||!away){alert('Enter both team names.');return;}
  if(home.toLowerCase()===away.toLowerCase()){alert('Choose two different teams.');return;}
  const monthKey=/^\d{4}-\d{2}-\d{2}$/.test(date)?date.slice(0,7):currentMonth();
  data.fixtures.push({
   home,away,date,monthKey,
   notes:String(fd.get('notes')||''),played:false
  });
  save();page='fixtures';render();
 });
}
function editResult(i){
 const f=data.fixtures[i];if(!f)return;
 const hs=prompt('Fish caught by '+f.home+':',f.played?f.hs:'');
 if(hs===null)return;
 const as=prompt('Fish caught by '+f.away+':',f.played?f.as:'');
 if(as===null)return;
 if(hs.trim()===''||as.trim()===''||!Number.isInteger(Number(hs))||!Number.isInteger(Number(as))||Number(hs)<0||Number(as)<0){
  alert('Enter a whole number of fish (zero or more) for both teams.');return;
 }
 f.hs=Number(hs);f.as=Number(as);f.played=true;
 save();render();
}
function deleteFixture(i){
 if(!confirm('Delete this fixture?'))return;
 data.fixtures.splice(i,1);save();render();
}
document.getElementById('nav').addEventListener('click',e=>{
 const b=e.target.closest('button[data-page]');
 if(!b)return;
 page=b.dataset.page;selectedHistoryMonth='';render();
});

// Preserve existing fixtures and archive earlier months on app launch.
data.fixtures.forEach(f=>{
 if(!f.monthKey)f.monthKey=(f.date&&/^\d{4}-\d{2}/.test(f.date))?f.date.slice(0,7):currentMonth();
});
archivePastMonths();
render();
</script>
</body>
</html>
