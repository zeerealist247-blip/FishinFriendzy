
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101814">
<title>Fishin Friendzy</title>
<style>
:root{color-scheme:dark;--bg:#101814;--panel:#1b2720;--green:#9bd36b;--muted:#a7b5aa;--line:#354439}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f2f6ef;font:16px Arial,sans-serif}
header{padding:22px 16px 14px;background:#17231b;border-bottom:1px solid var(--line)}
h1{margin:0;color:var(--green);font-size:27px}
header p{margin:7px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;gap:7px;padding:12px;overflow-x:auto;background:#141e17}
button{background:#2a3b2e;color:white;border:1px solid #49604c;border-radius:9px;padding:11px 13px;font-weight:bold;cursor:pointer}
button.active,button.primary{background:var(--green);color:#142015;border-color:var(--green)}
main{padding:14px;max-width:850px;margin:auto}
h2{font-size:21px;margin:10px 0 14px}
.panel,.fixture{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted,small{color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:11px 7px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--green)}
th:nth-child(2),td:nth-child(2){text-align:left}
input{width:100%;padding:12px;background:#101814;color:white;border:1px solid #526454;border-radius:8px;margin:6px 0 12px;font-size:16px}
label{display:block;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{width:100%}
.fixture-top{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;text-align:center;font-weight:bold}
.score{font-size:24px;color:var(--green)}
.status{font-size:12px;color:var(--green)}
.empty{text-align:center;padding:25px;color:var(--muted)}
.danger{background:#472624;border-color:#7d403a}
</style>
</head>
<body>
<header>
<h1>🎣 Fishin Friendzy</h1>
<p>Your fishing league. Your fixtures. Your bragging rights.</p>
</header>
<nav id="nav">
<button data-page="league" class="active">🏆 League</button>
<button data-page="fixtures">📅 Fixtures</button>
<button data-page="add">➕ Add Fixture</button>
<button data-page="teams">🐟 Teams</button>
</nav>
<main id="app"></main>
<script>
const KEY='fishin-friendzy-data-v1';
let data;
try {
 data=JSON.parse(localStorage.getItem(KEY))||{fixtures:[]};
} catch(e) {
 data={fixtures:[]};
}
if(!Array.isArray(data.fixtures)) data.fixtures=[];
let page='league';

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}
function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function teams(){
 return [...new Set(data.fixtures.flatMap(f=>[f.home,f.away]).filter(Boolean))]
 .sort((a,b)=>a.localeCompare(b));
}
function stats(){
 let out={};
 teams().forEach(t=>out[t]={
 team:t,p:0,w:0,d:0,l:0,for:0,against:0,played:0
 });
 data.fixtures.filter(f=>f.played).forEach(f=>{
  if(!out[f.home]||!out[f.away])return;
  let h=out[f.home],a=out[f.away];
  let hs=Number(f.hs),as=Number(f.as);
  h.played++;a.played++;
  h.for+=hs;h.against+=as;
  a.for+=as;a.against+=hs;
  if(hs>as){h.w++;h.p+=3;a.l++}
  else if(hs<as){a.w++;a.p+=3;h.l++}
  else{h.d++;a.d++;h.p++;a.p++}
 });
 return Object.values(out).map(t=>({...t,gd:t.for-t.against}))
 .sort((a,b)=>b.p-a.p||b.gd-a.gd||b.for-a.for||a.team.localeCompare(b.team));
}
function fixtureCard(f,i){
 return `<div class="fixture">
 <div class="fixture-top"><span>${esc(f.date||'Date not set')}</span>
 <span class="status">${f.played?'✓ RESULT':'UPCOMING'}</span></div>
 <div class="teams"><span>${esc(f.home)}</span>
 <span class="score">${f.played?esc(f.hs)+' - '+esc(f.as):'v'}</span>
 <span>${esc(f.away)}</span></div>
 ${f.notes?`<p class="muted">${esc(f.notes)}</p>`:''}
 <div style="display:flex;gap:8px;margin-top:14px">
 <button class="primary" onclick="editResult(${i})">${f.played?'Edit score':'Enter result'}</button>
 <button class="danger" onclick="deleteFixture(${i})">Delete</button>
 </div></div>`;
}
function fixtureList(onlyPlayed=false){
 let list=data.fixtures.map((f,i)=>({f,i}))
 .filter(x=>!onlyPlayed||x.f.played)
 .sort((a,b)=>(a.f.date||'9999').localeCompare(b.f.date||'9999'));
 return list.length?list.map(x=>fixtureCard(x.f,x.i)).join('')
 :'<div class="panel empty">No fixtures here yet.</div>';
}
  
function showLeague(){
 let rows=stats().map((t,i)=>`<tr>
 <td>${i+1}</td><td><b>${esc(t.team)}</b></td>
 <td>${t.played}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
 <td>${t.for}</td><td>${t.against}</td>
 <td>${t.gd>0?'+':''}${t.gd}</td><td><b>${t.p}</b></td></tr>`).join('');
 return `<h2>🏆 League Table</h2><div class="panel"><div class="table-wrap">
 <table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Fish+</th><th>Fish−</th><th>FD</th><th>Pts</th></tr></thead>
 <tbody>${rows||'<tr><td colspan="10">Add a fixture to get started</td></tr>'}</tbody></table>
 </div><p class="muted">Win = 3 points · Draw = 1 point each · Loss = 0 points. FD = fish difference.</p></div>
 <h2>Latest Results</h2>${fixtureList(true)}`;
}
function showFixtures(){
 return `<h2>📅 Fixtures & Results</h2>${fixtureList()}`;
}
function showAdd(){
 let ts=teams();
 return `<h2>➕ Add Fixture</h2><div class="panel"><form id="fixtureForm">
 <label>Home team</label><input name="home" required maxlength="50" placeholder="e.g. The Carp Kings" list="teamList">
 <label>Away team</label><input name="away" required maxlength="50" placeholder="e.g. Bait Bandits" list="teamList">
 <datalist id="teamList">${ts.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
 <div class="grid"><div><label>Fixture date</label><input type="date" name="date"></div>
 <div><label>Venue (optional)</label><input name="notes" maxlength="100" placeholder="Lake / venue"></div></div>
 <button class="primary full" type="submit">Save Fixture</button></form></div>
 <p class="muted">Teams are added automatically when you create fixtures.</p>`;
}
function showTeams(){
 let ts=teams();
 return `<h2>🐟 Teams</h2><div class="panel">
 ${ts.length?ts.map(t=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)">${esc(t)}</div>`).join(''):'<p class="muted">No teams yet. Add a fixture to create your teams.</p>'}
 </div>`;
}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 let app=document.getElementById('app');
 if(page==='league')app.innerHTML=showLeague();
 if(page==='fixtures')app.innerHTML=showFixtures();
 if(page==='add')app.innerHTML=showAdd();
 if(page==='teams')app.innerHTML=showTeams();
 let form=document.getElementById('fixtureForm');
 if(form)form.addEventListener('submit',e=>{
  e.preventDefault();
  let fd=new FormData(form);
  let home=String(fd.get('home')||'').trim();
  let away=String(fd.get('away')||'').trim();
  if(!home||!away){alert('Enter both team names.');return}
  if(home.toLowerCase()===away.toLowerCase()){alert('Choose two different teams.');return}
  data.fixtures.push({
   home,away,date:String(fd.get('date')||''),
   notes:String(fd.get('notes')||''),played:false
  });
  save();page='fixtures';render();
 });
}
function editResult(i){
 let f=data.fixtures[i];if(!f)return;
 let hs=prompt('Fish caught by '+f.home+':',f.played?f.hs:'');
 if(hs===null)return;
 let as=prompt('Fish caught by '+f.away+':',f.played?f.as:'');
 if(as===null)return;
 if(hs.trim()===''||as.trim()===''||!Number.isInteger(Number(hs))||!Number.isInteger(Number(as))||Number(hs)<0||Number(as)<0){
  alert('Enter a whole number of fish (zero or more) for both teams.');return;
 }
 f.hs=Number(hs);f.as=Number(as);f.played=true;
 save();render();
}
function deleteFixture(i){
 if(!confirm('Delete this fixture?'))return;
 data.fixtures.splice(i,1);save();render();
}
document.getElementById('nav').addEventListener('click',e=>{
 let b=e.target.closest('button[data-page]');
 if(!b)return;
 page=b.dataset.page;render();
});
render();
</script>
</body>
</html>
